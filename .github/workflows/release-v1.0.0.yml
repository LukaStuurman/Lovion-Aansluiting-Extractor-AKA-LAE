name: Release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.0.yml

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'release: publish v1.0.0')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PowerShell GUI and CLI
        shell: powershell
        run: |
          .\Build-LovionCoordinateToolGuiExe.ps1 -OutputDirectory .\dist
          .\Build-LovionCoordinateToolExe.ps1 -OutputDirectory .\dist

      - name: Build native C++ CLI
        shell: powershell
        run: |
          cmake -S .\cpp -B .\cpp\build -A x64
          cmake --build .\cpp\build --config Release

      - name: Package release assets
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $PWD 'release'
          $packageDir = Join-Path $releaseDir 'Lovion-Aansluiting-Extractor-v1.0.0'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir 'app') | Out-Null

          Copy-Item .\dist\LovionCoordinateWorkbench.exe $packageDir -Force
          Copy-Item .\dist\app\LovionCoordinateTool.Gui.ps1 (Join-Path $packageDir 'app\LovionCoordinateTool.Gui.ps1') -Force
          Copy-Item .\dist\LovionCoordinateTool.exe $packageDir -Force
          Copy-Item .\cpp\build\Release\LovionCoordinateToolCpp.exe $packageDir -Force
          Copy-Item .\README.md $packageDir -Force

          $zipPath = Join-Path $releaseDir 'Lovion-Aansluiting-Extractor-v1.0.0-Windows.zip'
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $zipPath -Force

          Copy-Item .\dist\LovionCoordinateTool.exe (Join-Path $releaseDir 'LovionCoordinateTool-v1.0.0.exe') -Force
          Copy-Item .\cpp\build\Release\LovionCoordinateToolCpp.exe (Join-Path $releaseDir 'LovionCoordinateToolCpp-v1.0.0.exe') -Force

          $assets = @(
            $zipPath,
            (Join-Path $releaseDir 'LovionCoordinateTool-v1.0.0.exe'),
            (Join-Path $releaseDir 'LovionCoordinateToolCpp-v1.0.0.exe')
          )
          $sumLines = foreach ($asset in $assets) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $asset
            '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), (Split-Path $asset -Leaf)
          }
          Set-Content -Path (Join-Path $releaseDir 'SHA256SUMS.txt') -Value $sumLines -Encoding ASCII

          @'
          # Lovion Aansluiting Extractor v1.0.0

          Eerste officiële release van de Lovion Aansluiting Extractor.

          ## Belangrijkste functies
          - GUI-workbench voor meerdere TXT-, XLSX- en CSV-bestanden.
          - Lovion station- en 100-batchautomatisering.
          - PDOK-geocoding met parallelle adresqueries en fallbacks.
          - Snappen naar Enexis WFS voor service connections en street furniture.
          - Export naar CSV, GeoJSON en shapefile.
          - Herlezen en verwerken van Overdrachtspunt-coördinaten.
          - Native C++ CLI naast de PowerShell GUI/CLI.

          ## Downloads
          - `Lovion-Aansluiting-Extractor-v1.0.0-Windows.zip` — aanbevolen complete Windows-versie met GUI en CLI's.
          - `LovionCoordinateTool-v1.0.0.exe` — PowerShell CLI launcher.
          - `LovionCoordinateToolCpp-v1.0.0.exe` — native C++ CLI.
          - `SHA256SUMS.txt` — SHA-256 checksums van de releasebestanden.

          De GUI in het ZIP-pakket gebruikt het meegeleverde `app/LovionCoordinateTool.Gui.ps1`; houd de mapstructuur daarom intact.
          '@ | Set-Content -Path (Join-Path $releaseDir 'RELEASE_NOTES.md') -Encoding UTF8

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 `
            --repo "$env:GITHUB_REPOSITORY" `
            --target "$env:GITHUB_SHA" `
            --title "Lovion Aansluiting Extractor v1.0.0" `
            --notes-file ".\release\RELEASE_NOTES.md" `
            ".\release\Lovion-Aansluiting-Extractor-v1.0.0-Windows.zip" `
            ".\release\LovionCoordinateTool-v1.0.0.exe" `
            ".\release\LovionCoordinateToolCpp-v1.0.0.exe" `
            ".\release\SHA256SUMS.txt"
