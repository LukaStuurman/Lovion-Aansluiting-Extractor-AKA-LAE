name: Release v1.2.0

on:
  push:
    tags:
      - v1.2.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone Workbench
        shell: powershell
        run: |
          .\Build-LovionCoordinateToolGuiExe.ps1 -OutputDirectory .\dist

      - name: Smoke test standalone Workbench
        shell: powershell
        run: |
          $process = Start-Process `
            -FilePath ".\dist\LovionCoordinateWorkbench.exe" `
            -ArgumentList "-SmokeTest" `
            -PassThru `
            -Wait

          if ($process.ExitCode -ne 0) {
            throw "LovionCoordinateWorkbench.exe smoke test faalde met exitcode $($process.ExitCode)."
          }

      - name: Prepare release notes
        shell: powershell
        run: |
          $releaseDir = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $notes = @'
          # Lovion Aansluiting Extractor v1.2.0

          Deze release bevat de robuuste Lovion/Citrix-stationsworkflow.

          ## Stationsworkflow
          - `Aantal geladen` bepaalt hoeveel trafo's bij een station horen.
          - Bij één resultaat wordt de enige rij niet aangeklikt; de workflow gaat direct naar `Open` en `VIEW`.
          - Bij meerdere resultaten wordt de juiste rij via OCR aan `Master Asset ID` in de rechterresultaatlijst gekoppeld.
          - Na trafo 1 keert Lovion terug naar de al geladen eerste resultatenlijst; trafo 2 en volgende worden daar direct geselecteerd zonder opnieuw zoeken of `Start query`.
          - Alle trafo's van één station behouden hetzelfde stationnummer als `SourceFile`.

          De volledige werkwijze en onderhoudsinstructies staan in `README.md`.

          ## Download
          - `LovionCoordinateWorkbench.exe` - standalone Windows GUI-versie.

          De Workbench bevat het benodigde PowerShell-applicatiescript ingebed in de EXE. Er zijn geen losse scripts, CLI-versies of ZIP-bestanden nodig.
          '@
          [System.IO.File]::WriteAllText((Join-Path $releaseDir 'RELEASE_NOTES.md'), $notes, [System.Text.Encoding]::ASCII)

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Houd de v1.2.0-tag gelijk aan de code waarmee de standalone EXE is gebouwd.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.2.0 "$env:GITHUB_SHA"
          git push origin "refs/tags/v1.2.0" --force

          # Een ontbrekende release is normaal bij de eerste publicatie.
          # Laat gh's exitcode wel uitlezen zonder dat PowerShell de stderr als exception behandelt.
          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view v1.2.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $savedErrorActionPreference

          if ($releaseExists) {
            # Verwijder alle oude release-assets. Alleen de Workbench EXE blijft over.
            $assetNames = @(gh release view v1.2.0 `
              --repo "$env:GITHUB_REPOSITORY" `
              --json assets `
              --jq '.assets[].name')

            foreach ($assetName in $assetNames) {
              if (-not [string]::IsNullOrWhiteSpace($assetName)) {
                gh release delete-asset v1.2.0 "$assetName" `
                  --repo "$env:GITHUB_REPOSITORY" `
                  --yes
              }
            }

            gh release edit v1.2.0 `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "Lovion Aansluiting Extractor v1.2.0" `
              --notes-file ".\release\RELEASE_NOTES.md"

            gh release upload v1.2.0 `
              --repo "$env:GITHUB_REPOSITORY" `
              ".\dist\LovionCoordinateWorkbench.exe"
          }
          else {
            gh release create v1.2.0 `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title "Lovion Aansluiting Extractor v1.2.0" `
              --notes-file ".\release\RELEASE_NOTES.md" `
              ".\dist\LovionCoordinateWorkbench.exe"
          }

