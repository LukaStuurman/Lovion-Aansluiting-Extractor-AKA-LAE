name: Lovion regression tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-regression-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run regression tests
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'Test-GuiSurface.ps1',
            'Test-LovionMacro.ps1',
            'Test-LovionConnectionsTable.ps1',
            'Test-LovionStationWorkflow.ps1',
            'Test-CsvLocale.ps1',
            'Test-PlannedTransformers.ps1',
            'Test-StationResume.ps1',
            'Test-LargeGridAccessibility.ps1'
          )
          foreach ($test in $tests) {
            & powershell.exe -NoProfile -Sta -ExecutionPolicy Bypass -File (Join-Path '.\tests' $test)
            if ($LASTEXITCODE -ne 0) { throw "Regressietest $test faalde." }
          }
